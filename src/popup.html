<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>myQU Banner</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #221419;
        --muted: #7a6970;
        --hairline: #e8dee2;
        --surface-2: #f3edef;
        --brand: #8e1637;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #211a1e;
          --ink: #f5eef1;
          --muted: #a2929a;
          --hairline: #372c32;
          --surface-2: #2a2126;
          --brand: #e58aa2;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 268px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      h1 {
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 2px;
      }
      .sub {
        font-size: 11.5px;
        color: var(--muted);
        margin: 0 0 16px;
      }
      fieldset {
        border: 0;
        margin: 0 0 14px;
        padding: 0;
      }
      legend {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
        padding: 0;
      }
      .seg {
        display: flex;
        border: 1px solid var(--hairline);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        flex: 1;
        border: 0;
        background: none;
        color: var(--ink);
        font: 600 12px/1 inherit;
        padding: 9px 6px;
        cursor: pointer;
      }
      .seg button:hover { background: var(--surface-2); }
      .seg button[aria-pressed="true"] {
        background: var(--brand);
        color: #fff;
      }
      .seg button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: -2px;
      }
      .note {
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
        border-top: 1px solid var(--hairline);
        padding-top: 12px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>myQU Banner</h1>
    <p class="sub">Restyles mybanner.qu.edu.qa in place.</p>

    <fieldset>
      <legend>Restyle this site</legend>
      <div class="seg" id="enabled">
        <button type="button" data-value="on">On</button>
        <button type="button" data-value="off">Off</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Theme</legend>
      <div class="seg" id="theme">
        <button type="button" data-value="qu">QU maroon</button>
        <button type="button" data-value="acm">ACM mint</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Appearance</legend>
      <div class="seg" id="mode">
        <button type="button" data-value="auto">Auto</button>
        <button type="button" data-value="light">Light</button>
        <button type="button" data-value="dark">Dark</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Animations</legend>
      <div class="seg" id="motion">
        <button type="button" data-value="on">On</button>
        <button type="button" data-value="off">Off</button>
      </div>
    </fieldset>

    <p class="note">
      Turning it off hands the page back to Banner untouched, and reloads.
      Page content always stays exactly as the University publishes it.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
